name: Publish Docker Images

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push Vortex TSDB
        uses: docker/build-push-action@v6
        with:
          context: ./backend/tsdb-service
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            fredfeng033/vortex-tsdb:${{ steps.version.outputs.VERSION }}
            fredfeng033/vortex-tsdb:latest

      - name: Build and push Vortex TSDB Web
        uses: docker/build-push-action@v6
        with:
          context: ./frontend/tsdb-web
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            fredfeng033/vortex-tsdb-web:${{ steps.version.outputs.VERSION }}
            fredfeng033/vortex-tsdb-web:latest
